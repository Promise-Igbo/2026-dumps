apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rook-ceph-capacity-alerts
  namespace: rook-ceph # Change to your monitoring namespace if required
  labels:
    role: alert-rules
spec:
  groups:
  - name: ceph-capacity.rules
    rules:
    - alert: CephClusterNearFull
      # Triggers if the raw storage utilization crosses 75%
      expr: (ceph_cluster_total_used_bytes / ceph_cluster_total_bytes) * 100 > 75
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Ceph cluster storage is nearing capacity"
        description: "Ceph cluster is {{ printf \"%.2f\" $value }}% full. Clean up data or scale up storage immediately."

    - alert: CephClusterCriticalFull
      # Triggers if utilization crosses 85% (Right before Ceph locks writes)
      expr: (ceph_cluster_total_used_bytes / ceph_cluster_total_bytes) * 100 > 85
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Ceph cluster storage critically full - Action Required"
        description: "Ceph cluster is {{ printf \"%.2f\" $value }}% full. Writes will be blocked soon!"
